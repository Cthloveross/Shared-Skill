[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharedskill"
version = "0.4.0"
description = "Shared-Skill: shared agent skills, session feedback, and collective evolution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "tiktoken",
    "requests",
]

[project.urls]
Repository = "https://github.com/Cthloveross/Shared-Skill"
Documentation = "https://github.com/Cthloveross/Shared-Skill/tree/main/docs"

[project.optional-dependencies]
# Embedding-based skill retrieval
embedding = [
    "numpy",
    "sentence-transformers",
]
# Skill evolution / OPD / PRM via OpenAI-compatible LLM
evolve = [
    "openai",
]
# Cloud skill sharing via Alibaba Cloud OSS
sharing = [
    "boto3",
    "oss2",
]
# Central evolve server deployment
server = [
    "boto3",
    "openai",
    "oss2",
    "python-dotenv",
]
# Real workbook fixtures used by the benign workflow acceptance runner.
validation = [
    "openpyxl>=3.1",
]
# Everything
all = [
    "sharedskill[embedding,evolve,sharing,server,validation]",
]

[project.scripts]
sharedskill = "sharedskill.cli:sharedskill"
sharedskill-evolve-server = "evolve_server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sharedskill*", "evolve_server*"]

[tool.setuptools.package-data]
sharedskill = ["dashboard_assets/*"]
evolve_server = ["engines/EVOLVE_AGENTS.md"]

[tool.ruff]
line-length = 120
extend-exclude = ["reproduction/reference", "artifacts", "outputs", "runtime", "benign_validation/results"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"evolve_server/pipeline/execution.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/poisoned_evolution/tests"]

[tool.uv]
# Install with: uv sync --extra all
